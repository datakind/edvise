# NSC/PDP SFTP automated ingestion: Git-sourced spark_python_task chain (01→02→03).
# Prerequisites: Job parameter DB_workspace (Unity Catalog), matching UC tables/volumes,
# Databricks secret scope/key (passed via DAB vars from GitHub Secrets at deploy),
# and cluster egress for SFTP/APIs.
#
# File selection:
#   - Set cohort_file_name + course_file_name for a manual run, OR
#   - Leave them empty and use file_selection_mode=skip_ingested|latest (default: skip_ingested).
# Testing: force_reingest=true resets manifest/queue/plan for the selected pair and
# overwrites existing bronze CSVs (use with latest or manual).

resources:
  jobs:
    nsc_sftp_automated_ingestion:
      name: nsc_sftp_automated_ingestion
      max_concurrent_runs: 1
      queue:
        enabled: true
      webhook_notifications:
        on_failure:
          - id: ${var.ingestion_slack_webhook_id}

      parameters:
        - name: DB_workspace
          default: ${var.DB_workspace}
        - name: nsc_sftp_secret_scope
          default: ${var.nsc_sftp_secret_scope}
        - name: sst_api_key_secret_key
          default: ${var.sst_api_key_secret_key}
        - name: file_selection_mode
          default: skip_ingested
        - name: force_reingest
          default: "false"
        - name: cohort_file_name
          default: ""
        - name: course_file_name
          default: ""

      tasks:
        - task_key: sftp_receive_scan
          spark_python_task:
            python_file: src/edvise/ingestion/nsc_sftp/scripts/01_sftp_receive_scan.py
            source: GIT
            parameters:
              - --DB_workspace
              - "{{job.parameters.DB_workspace}}"
              - --nsc_sftp_secret_scope
              - "{{job.parameters.nsc_sftp_secret_scope}}"
              - --file_selection_mode
              - "{{job.parameters.file_selection_mode}}"
              - --force_reingest
              - "{{job.parameters.force_reingest}}"
              - --cohort_file_name
              - "{{job.parameters.cohort_file_name}}"
              - --course_file_name
              - "{{job.parameters.course_file_name}}"
          job_cluster_key: nsc-sftp-ingestion-cluster
          libraries:
            - pypi:
                package: pandas==2.2.3
            - pypi:
                package: numpy==1.26.4
            - pypi:
                package: pyarrow>=17.0.0
            - pypi:
                package: requests==2.32.5
            - pypi:
                package: pyyaml~=6.0
            - pypi:
                package: pydantic~=2.10
            - pypi:
                package: paramiko~=3.5

        - task_key: file_institution_expand
          depends_on:
            - task_key: sftp_receive_scan
          spark_python_task:
            python_file: src/edvise/ingestion/nsc_sftp/scripts/02_file_institution_expand.py
            source: GIT
            parameters:
              - --DB_workspace
              - "{{job.parameters.DB_workspace}}"
              - --nsc_sftp_secret_scope
              - "{{job.parameters.nsc_sftp_secret_scope}}"
              - --sst_api_key_secret_key
              - "{{job.parameters.sst_api_key_secret_key}}"
          job_cluster_key: nsc-sftp-ingestion-cluster
          libraries:
            - pypi:
                package: pandas==2.2.3
            - pypi:
                package: numpy==1.26.4
            - pypi:
                package: pyarrow>=17.0.0
            - pypi:
                package: requests==2.32.5
            - pypi:
                package: pyyaml~=6.0
            - pypi:
                package: pydantic~=2.10

        - task_key: per_institution_bronze_ingest
          depends_on:
            - task_key: file_institution_expand
          spark_python_task:
            python_file: src/edvise/ingestion/nsc_sftp/scripts/03_per_institution_bronze_ingest.py
            source: GIT
            parameters:
              - --DB_workspace
              - "{{job.parameters.DB_workspace}}"
              - --nsc_sftp_secret_scope
              - "{{job.parameters.nsc_sftp_secret_scope}}"
              - --sst_api_key_secret_key
              - "{{job.parameters.sst_api_key_secret_key}}"
              - --force_reingest
              - "{{job.parameters.force_reingest}}"
          job_cluster_key: nsc-sftp-ingestion-cluster
          libraries:
            - pypi:
                package: pandas==2.2.3
            - pypi:
                package: numpy==1.26.4
            - pypi:
                package: pyarrow>=17.0.0
            - pypi:
                package: requests==2.32.5
            - pypi:
                package: pyyaml~=6.0
            - pypi:
                package: pydantic~=2.10

      job_clusters:
        - job_cluster_key: nsc-sftp-ingestion-cluster
          new_cluster:
            cluster_name: ""
            spark_version: 15.4.x-cpu-ml-scala2.12
            spark_conf:
              spark.master: local[*, 4]
              spark.databricks.cluster.profile: singleNode
            gcp_attributes:
              use_preemptible_executors: false
              availability: ON_DEMAND_GCP
              zone_id: HA
            node_type_id: n2-standard-16
            custom_tags:
              ResourceClass: SingleNode
              x-databricks-nextgen-cluster: "true"
            enable_elastic_disk: true
            data_security_mode: SINGLE_USER
            runtime_engine: STANDARD
            num_workers: 0

      permissions:
        - group_name: ${var.datakind_group_to_manage_workflow}
          level: CAN_MANAGE
        - service_principal_name: ${var.ds_run_as}
          level: CAN_MANAGE
        - user_name: ${var.service_account_executer}
          level: CAN_MANAGE
