# ES versioned inference launcher — materialize + validate + trigger.
#
# Resolves the model's ES pipeline_version, fetches archived ES DAB YAML into
#   /Volumes/{ws}/default/edvise_releases/es/{version}/
# and for GenAI schools also fetches GenAI execute YAML (at registry pipeline_version) into
#   …/es/{version}/genai/
# then validates contracts and submits child inference run(s):
#   non-GenAI → one ES-full spark run @ ES pipeline_version
#   GenAI → ES ingestion @ ES → GenAI execute @ registry → ES inference @ ES
#
# Does not replace github_sourced_genai_es_inference_pipeline (fallback remains).
resources:
  jobs:
    edvise_es_versioned_inference_launcher:
      name: edvise_es_versioned_inference_launcher
      description: >
        Version-safe ES inference entry point. Resolves the model's ES pipeline_version,
        materializes archived ES (+ optional GenAI) DAB YAML, validates runtime/parameter
        contracts, then submits ES-full (one child) or dual-pin GenAI (three children)
        inference runs. Original github_sourced_genai_es_inference_pipeline is unchanged.
      webhook_notifications:
        on_failure:
          - id: ${var.inference_slack_webhook_id}
      max_concurrent_runs: 5
      tasks:
        - task_key: materialize_runtime_bundle
          description: >
            Resolve ES pipeline_version from model metadata; fetch ES inference DAB YAML
            from GitHub into edvise_releases/es/{version}/. When is_genai_institution is
            true, also fetch GenAI execute YAML at the active-registry pipeline_version
            into …/es/{version}/genai/.
          spark_python_task:
            python_file: src/edvise/scripts/inference_launcher_materialize_es.py
            source: GIT
            parameters:
              - --databricks_institution_name
              - "{{job.parameters.databricks_institution_name}}"
              - --model_name
              - "{{job.parameters.model_name}}"
              - --model_run_id
              - "{{job.parameters.model_run_id}}"
              - --DB_workspace
              - "{{job.parameters.DB_workspace}}"
              - --schema_type
              - "{{job.parameters.schema_type}}"
              - --release_base_path
              - "{{job.parameters.release_base_path}}"
              - --github_repo
              - "{{job.parameters.github_repo}}"
              - --is_genai_institution
              - "{{job.parameters.is_genai_institution}}"
              - --launcher_run_id
              - "{{job.parameters.launcher_run_id}}"
          job_cluster_key: edvise-es-versioned-inference-launcher-cluster
        - task_key: versioned_inference_launcher_validate
          description: >
            Validate archived ES bundle (DBR/Python) and parameter contract. For GenAI
            schools, also require …/genai/ snapshot, check GenAI runtime compatibility,
            and record both ES and GenAI pipeline_version on the launcher event.
          depends_on:
            - task_key: materialize_runtime_bundle
          spark_python_task:
            python_file: src/edvise/scripts/inference_launcher_validate_es.py
            source: GIT
            parameters:
              - --databricks_institution_name
              - "{{job.parameters.databricks_institution_name}}"
              - --model_name
              - "{{job.parameters.model_name}}"
              - --model_run_id
              - "{{job.parameters.model_run_id}}"
              - --DB_workspace
              - "{{job.parameters.DB_workspace}}"
              - --schema_type
              - "{{job.parameters.schema_type}}"
              - --release_base_path
              - "{{job.parameters.release_base_path}}"
              - --git_url
              - "{{job.parameters.git_url}}"
              - --is_genai_institution
              - "{{job.parameters.is_genai_institution}}"
              - --batch_id
              - "{{job.parameters.batch_id}}"
              - --validated_blob_paths_json
              - "{{job.parameters.validated_blob_paths_json}}"
              - --config_file_name
              - "{{job.parameters.config_file_name}}"
              - --genai_inputs_toml_path
              - "{{job.parameters.genai_inputs_toml_path}}"
              - --term_filter
              - "{{job.parameters.term_filter}}"
              - --gcp_bucket_name
              - "{{job.parameters.gcp_bucket_name}}"
              - --datakind_notification_email
              - "{{job.parameters.datakind_notification_email}}"
              - --DK_CC_EMAIL
              - "{{job.parameters.DK_CC_EMAIL}}"
              - --ds_run_as
              - "{{job.parameters.ds_run_as}}"
              - --service_account_executer
              - "{{job.parameters.service_account_executer}}"
              - --datakind_group_to_manage_workflow
              - "{{job.parameters.datakind_group_to_manage_workflow}}"
              - --inference_parameters_json
              - "{{job.parameters.inference_parameters_json}}"
              - --launcher_run_id
              - "{{job.parameters.launcher_run_id}}"
          job_cluster_key: edvise-es-versioned-inference-launcher-cluster
        - task_key: trigger_versioned_inference
          description: >
            Non-GenAI: submit ES-full inference at the model's pipeline_version.
            GenAI: submit ES data_ingestion @ ES pin, GenAI execute @ registry pin, then
            ES inference @ ES pin (shared db_run_id = launcher run id). Hard I/O checks
            link bronze → GenAI pipeline_input → silver inference. Waits for child
            completion and fails if any required child or I/O check fails.
          depends_on:
            - task_key: versioned_inference_launcher_validate
          spark_python_task:
            python_file: src/edvise/scripts/inference_launcher_trigger_es.py
            source: GIT
            parameters:
              - --databricks_institution_name
              - "{{job.parameters.databricks_institution_name}}"
              - --model_name
              - "{{job.parameters.model_name}}"
              - --model_run_id
              - "{{job.parameters.model_run_id}}"
              - --DB_workspace
              - "{{job.parameters.DB_workspace}}"
              - --schema_type
              - "{{job.parameters.schema_type}}"
              - --release_base_path
              - "{{job.parameters.release_base_path}}"
              - --git_url
              - "{{job.parameters.git_url}}"
              - --is_genai_institution
              - "{{job.parameters.is_genai_institution}}"
              - --batch_id
              - "{{job.parameters.batch_id}}"
              - --validated_blob_paths_json
              - "{{job.parameters.validated_blob_paths_json}}"
              - --config_file_name
              - "{{job.parameters.config_file_name}}"
              - --genai_inputs_toml_path
              - "{{job.parameters.genai_inputs_toml_path}}"
              - --term_filter
              - "{{job.parameters.term_filter}}"
              - --gcp_bucket_name
              - "{{job.parameters.gcp_bucket_name}}"
              - --datakind_notification_email
              - "{{job.parameters.datakind_notification_email}}"
              - --DK_CC_EMAIL
              - "{{job.parameters.DK_CC_EMAIL}}"
              - --ds_run_as
              - "{{job.parameters.ds_run_as}}"
              - --service_account_executer
              - "{{job.parameters.service_account_executer}}"
              - --datakind_group_to_manage_workflow
              - "{{job.parameters.datakind_group_to_manage_workflow}}"
              - --inference_parameters_json
              - "{{job.parameters.inference_parameters_json}}"
              - --launcher_run_id
              - "{{job.parameters.launcher_run_id}}"
          job_cluster_key: edvise-es-versioned-inference-launcher-cluster
      job_clusters:
        - job_cluster_key: edvise-es-versioned-inference-launcher-cluster
          new_cluster:
            cluster_name: ""
            spark_version: 15.4.x-cpu-ml-scala2.12
            spark_conf:
              spark.master: local[*, 4]
              spark.databricks.cluster.profile: singleNode
            gcp_attributes:
              use_preemptible_executors: false
              availability: ON_DEMAND_GCP
              zone_id: HA
            node_type_id: n2-standard-8
            custom_tags:
              ResourceClass: SingleNode
              x-databricks-nextgen-cluster: "true"
            enable_elastic_disk: true
            data_security_mode: SINGLE_USER
            runtime_engine: STANDARD
            num_workers: 0
      queue:
        enabled: true
      parameters:
        - name: databricks_institution_name
          default: ${var.databricks_institution_name}
        - name: model_name
          default: ${var.model_name}
        - name: model_run_id
          default: ""
        - name: DB_workspace
          default: ${var.DB_workspace}
        - name: schema_type
          default: "edvise"
        - name: release_base_path
          default: ${var.release_base_path}
        - name: github_repo
          default: "datakind/edvise"
        - name: git_url
          default: "https://github.com/datakind/edvise"
        - name: is_genai_institution
          default: "false"
        - name: batch_id
          default: ""
        - name: validated_blob_paths_json
          default: "[]"
        - name: config_file_name
          default: ${var.config_file_name}
        - name: genai_inputs_toml_path
          default: "inputs.toml"
        - name: term_filter
          default: ""
        - name: gcp_bucket_name
          default: ""
        - name: datakind_notification_email
          default: ${var.datakind_notification_email}
        - name: DK_CC_EMAIL
          default: ${var.DK_CC_EMAIL}
        - name: ds_run_as
          default: ${var.ds_run_as}
        - name: service_account_executer
          default: ${var.service_account_executer}
        - name: datakind_group_to_manage_workflow
          default: ${var.datakind_group_to_manage_workflow}
        - name: inference_parameters_json
          default: ""
        - name: launcher_run_id
          default: "{{job.run_id}}"
      permissions:
        - group_name: ${var.datakind_group_to_manage_workflow}
          level: CAN_MANAGE
        - service_principal_name: ${var.ds_run_as}
          level: CAN_MANAGE
        - user_name: ${var.service_account_executer}
          level: CAN_MANAGE
