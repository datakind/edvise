# Manual Step 2a model comparison. One run scores one gateway model against the
# Unity Catalog gold manifest and logs three decision metrics to MLflow.
#
# mlflow==3.3.2 is installed only on this job. Its dependency cap is
# pyarrow<22, so this cluster narrows the shared GenAI pin from pyarrow<26
# to pyarrow<22. pandas==2.2.3, numpy==1.26.4, and databricks-sdk~=0.38.0
# stay unchanged.
resources:
  jobs:
    edvise_genai_mapping_eval_step2a_pipeline:
      name: edvise_genai_mapping_eval_step2a
      timeout_seconds: 7200
      max_concurrent_runs: 6
      queue:
        enabled: true

      tasks:
        - task_key: eval_step2a
          spark_python_task:
            python_file: src/edvise/genai/mapping/scripts/edvise_genai_eval_step2a.py
            source: GIT
            parameters:
              - --catalog
              - "{{job.parameters.catalog}}"
              - --model
              - "{{job.parameters.model}}"
              - --gateway_model_id
              - "{{job.parameters.gateway_model_id}}"
              - --institution_id
              - "{{job.parameters.institution_id}}"
              - --reference_institution_id
              - "{{job.parameters.reference_institution_id}}"
              - --experiment_name
              - "{{job.parameters.experiment_name}}"
              - --pipeline_version
              - "{{job.parameters.pipeline_version}}"
          job_cluster_key: edvise-genai-mapping-eval-step2a-cluster
          libraries:
            - pypi:
                package: pandas==2.2.3
            - pypi:
                package: numpy==1.26.4
            - pypi:
                package: pandera==0.23.0
            - pypi:
                package: pydantic~=2.10
            - pypi:
                package: tomli==2.2.1
            - pypi:
                package: tomlkit==0.13.3
            - pypi:
                package: python-dotenv==1.0.1
            - pypi:
                package: openai>=1.0.0
            - pypi:
                package: databricks-sdk~=0.38.0
            - pypi:
                package: pyarrow>=17.0.0,<22
            - pypi:
                package: mlflow==3.3.2

      job_clusters:
        - job_cluster_key: edvise-genai-mapping-eval-step2a-cluster
          new_cluster:
            cluster_name: ""
            spark_version: 15.4.x-scala2.12
            spark_conf:
              spark.master: local[*, 4]
              spark.databricks.cluster.profile: singleNode
            gcp_attributes:
              use_preemptible_executors: false
              availability: ON_DEMAND_GCP
              zone_id: HA
            node_type_id: n2-standard-4
            custom_tags:
              ResourceClass: SingleNode
              x-databricks-nextgen-cluster: "true"
            enable_elastic_disk: true
            data_security_mode: SINGLE_USER
            runtime_engine: STANDARD
            num_workers: 0

      parameters:
        - name: catalog
          default: ${var.DB_workspace}
        - name: model
          default: sonnet:4.5
        - name: gateway_model_id
          default: ""
        - name: institution_id
          default: synthetic_coastal_cc
        - name: reference_institution_id
          default: synthetic_metro_research_uni
        - name: experiment_name
          default: /Shared/edvise/genai_mapping/step2a_model_comparison
        - name: pipeline_version
          default: ${var.pipeline_version}

      permissions:
        - group_name: ${var.datakind_group_to_manage_workflow}
          level: CAN_MANAGE
        - service_principal_name: ${var.ds_run_as}
          level: CAN_MANAGE
