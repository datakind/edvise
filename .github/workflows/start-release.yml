name: Start Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Optional override (X.Y.Z). Default is inferred from PR titles since
          the last tag: feat → minor, type! (e.g. feat! or fix!) → major,
          otherwise patch.
        required: false
        type: string

permissions:
  contents: write
  actions: write
  pull-requests: read

jobs:
  create-release-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch latest changes
        run: |
          git fetch origin --tags --prune
          git checkout develop
          git pull origin develop

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.11'

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install uv

      - name: Install project dependencies (uv)
        run: |
          uv venv
          uv pip install .

      - name: Resolve release version
        env:
          VERSION_INPUT: ${{ github.event.inputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          uv run python <<'PY' >> "$GITHUB_ENV"
          import os
          import sys

          from edvise.utils.automate_releases import plan_release

          requested = os.environ.get("VERSION_INPUT", "").strip()
          requested = requested.lstrip("v") or None
          version, bump = plan_release(
              repo=os.environ["GITHUB_REPOSITORY"],
              token=os.environ.get("GITHUB_TOKEN"),
              requested_version=requested,
          )
          print(f"VERSION={version}")
          print(f"BUMP_TYPE={bump}")
          print(f"Resolved release {version} ({bump})", file=sys.stderr)
          PY

      - name: Check if version already exists
        run: |
          if git rev-parse "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "Error: Tag v${VERSION} already exists"
            exit 1
          fi
          if git show-ref --verify --quiet "refs/remotes/origin/release/${VERSION}"; then
            echo "Error: Release branch release/${VERSION} already exists"
            exit 1
          fi

      - name: Create release branch (local only)
        run: |
          git checkout -b "release/${VERSION}"

      - name: Update version metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          uv run python -m edvise.scripts.update_version \
            --version "${VERSION}" \
            --changelog CHANGELOG.md \
            --pyproject pyproject.toml \
            --repo "${{ github.repository }}" \
            --token "${{ secrets.GITHUB_TOKEN }}"

      - name: Run uv sync
        run: |
          uv sync

      - name: Commit and push changes
        run: |
          git add CHANGELOG.md pyproject.toml uv.lock
          git commit -m "chore(release): prepare ${VERSION}"
          git push -u origin "release/${VERSION}"

      - name: Trigger release branch CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # GITHUB_TOKEN pushes do not trigger other workflows; dispatch explicitly.
          gh workflow run release-branch-ci-dev --ref "release/${VERSION}"
          echo "✓ Triggered release-branch-ci-dev on release/${VERSION}" >> $GITHUB_STEP_SUMMARY

      - name: Summary
        run: |
          echo "## Release branch created: release/${VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Bump type: \`${BUMP_TYPE}\`" >> $GITHUB_STEP_SUMMARY
          echo "✓ Version metadata updated" >> $GITHUB_STEP_SUMMARY
          echo "✓ Release branch pushed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Next step:** Once release CI completes, it will dispatch Finish Release to open the release PR." >> $GITHUB_STEP_SUMMARY

