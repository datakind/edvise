name: pre-release

on:
  # pull request targeting main branch
  pull_request:
    branches: [main]

jobs:
  check-changelog:
    # Belt-and-suspenders: only enforce changelog on release PRs into main.
    # Feature PRs target develop and should not fail this check.
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Get changed files
        id: changed-files
        uses: step-security/changed-files@v45.0.1
        with:
          files: |
            CHANGELOG.md
      - name: Ensure changelog updated
        if: steps.changed-files.outputs.any_changed == 'false'
        run: |
          echo "CHANGELOG.md file must be updated with release notes"
          exit 1
